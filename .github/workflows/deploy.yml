name: Deploy Outfit Planner

on:
  push:
    branches: [ main ]

jobs:
  # ─── Backend: Build, Test & Deploy to MonsterASP ───
  backend:
    name: Backend - Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test --no-build --verbosity normal

      - name: Publish backend
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Deploy to MonsterASP (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /api/
          dangerous-clean-slate: false

  # ─── Frontend: Build & Deploy to Vercel ───
  frontend:
    name: Frontend - Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/outfit-planner-ui

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/outfit-planner-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-cache

      - name: Build (Production)
        run: npm run build -- --configuration production

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: src/outfit-planner-ui